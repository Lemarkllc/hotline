<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemark One — панель управления</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16171A" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Тему нужно применить ДО первой отрисовки — иначе на тёмной системной теме
      // страница на долю секунды мигает светлым сплэшем (themeStore — zustand persist,
      // ключ "lemark-theme", инициализируется уже после гидратации React).
      (function () {
        try {
          var raw = localStorage.getItem("lemark-theme");
          var theme = raw ? JSON.parse(raw).state.theme : "system";
          var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {
          /* localStorage недоступен (приватный режим и т.п.) — остаёмся на системной теме через CSS media */
        }
      })();
    </script>
    <style>
      /* Статический сплэш (не React-компонент — должен появиться раньше, чем JS
       * успеет распарситься/выполниться). Только мобильная ширина — на десктопе
       * панель открывают как обычный веб-инструмент, а не "запускают приложение",
       * заставка там неуместна. Брейкпоинт совпадает с useIsMobile() (767px). */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7f6f5;
        transition: opacity 0.25s ease;
      }
      html.dark #app-splash {
        background: #101011;
      }
      #app-splash .wordmark {
        font-family: "Golos Text", system-ui, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #16171a;
      }
      html.dark #app-splash .wordmark {
        color: #ededea;
      }
      #app-splash .wordmark .dot {
        color: #c20f1a;
      }
      #app-splash .wordmark .one {
        font-weight: 300;
        color: #4c4b49;
      }
      html.dark #app-splash .wordmark .one {
        color: #a5a49f;
      }
      @media (min-width: 768px) {
        #app-splash {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="wordmark">Lemark<span class="dot">·</span> <span class="one">One</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Держим сплэш минимум 500мс независимо от того, как быстро отработал JS —
      // иначе на быстром соединении он мигнёт на один кадр и будет больше похож на
      // баг, чем на осознанный экран запуска. Дальше эстафету принимает React-скелетон
      // (см. App.tsx) — уже с реальным статусом загрузки данных пользователя.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var el = document.getElementById("app-splash");
          if (!el) return;
          el.style.opacity = "0";
          setTimeout(function () {
            el.remove();
          }, 250);
        }, 500);
      });
    </script>
  </body>
</html>
